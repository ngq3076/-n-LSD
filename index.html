<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Lịch sử Đảng 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#ffe3ef;--bg2:#e3f3ff;--card:#fff;--ink:#4a3350;--mut:#8a7290;--pink:#ff8fb8;--pink2:#ffc2da;--mint:#9be7c4;--mintd:#1f8a5c;--red:#ff7b8a;--redbg:#ffe4e8;--grn:#dcf9ec;--line:#ffd3e4;--shadow:0 8px 0 #ffc2da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1a30;--bg2:#1a2438;--card:#3a2a44;--ink:#fbeaf5;--mut:#c9b0d0;--pink:#ff8fb8;--pink2:#7a4a68;--mint:#3d8a6c;--mintd:#8ff0c3;--red:#ff7b8a;--redbg:#5a2a36;--grn:#254a3c;--line:#5a4266;--shadow:0 8px 0 #5a3a58}}
:root[data-theme="dark"]{--bg1:#2a1a30;--bg2:#1a2438;--card:#3a2a44;--ink:#fbeaf5;--mut:#c9b0d0;--pink:#ff8fb8;--pink2:#7a4a68;--mint:#3d8a6c;--mintd:#8ff0c3;--red:#ff7b8a;--redbg:#5a2a36;--grn:#254a3c;--line:#5a4266;--shadow:0 8px 0 #5a3a58}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Nunito','Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
h1,h2,.bal{font-family:'Baloo 2','Nunito',system-ui,sans-serif}
.stk{position:fixed;font-size:34px;pointer-events:none;user-select:none;z-index:0;animation:fl 6s ease-in-out infinite;opacity:.9}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-top:16px}
.hero{text-align:center}
.mascot{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.06)}}
h1{margin:6px 0 4px;font-size:32px;color:var(--pink)}
.sub{color:var(--mut);margin:0 0 6px;font-weight:600}
.lbl{font-weight:800;font-size:18px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:800 16px 'Nunito',sans-serif;cursor:pointer;transition:.15s}
.chip:hover{transform:translateY(-2px)}.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.06)}
input[type=range]{width:100%;accent-color:var(--pink);height:28px}
.cnt{display:flex;align-items:center;justify-content:center;gap:10px}
.cnt input[type=number]{width:96px;text-align:center;font:800 24px 'Baloo 2',sans-serif;border:3px solid var(--line);border-radius:16px;padding:6px;background:var(--card);color:var(--ink)}
.tog{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-weight:700}
.tog label{cursor:pointer;display:flex;align-items:center;gap:6px}
.tog input{accent-color:var(--pink);width:18px;height:18px}
.btn{display:block;width:100%;margin-top:22px;border:0;border-radius:22px;padding:14px;background:var(--pink);color:#fff;font:800 22px 'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 6px 0 #e86a9c;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e86a9c}
.btn.alt{background:var(--mint);box-shadow:0 6px 0 #6fc9a2;color:#125a3c}
.btn.sm{display:inline-block;width:auto;padding:8px 18px;font-size:16px;margin:0}
.top{display:flex;align-items:center;gap:10px;font-weight:800}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ffb36b);border-radius:99px;transition:width .3s}
.qn{display:inline-block;background:var(--pink2);color:var(--ink);border-radius:99px;padding:3px 14px;font-weight:800;font-size:14px}
.q{font:700 20px/1.45 'Baloo 2','Nunito',sans-serif;margin:12px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:12px 14px;margin-bottom:10px;font:700 16px/1.4 'Nunito',sans-serif;cursor:pointer;transition:.12s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--pink)}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;font-family:'Baloo 2',sans-serif}
.opt.ok{background:var(--grn);border-color:var(--mint)}.opt.ok b{background:var(--mint);color:#125a3c}
.opt.no{background:var(--redbg);border-color:var(--red);animation:sh .35s}.opt.no b{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:30px;font:800 18px 'Baloo 2',sans-serif;margin:6px 0}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}
.res{text-align:center}.score{font:800 64px 'Baloo 2',sans-serif;color:var(--pink);line-height:1}
.rv{border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;background:var(--card)}
.rv .a{color:var(--mintd);font-weight:800}.rv .w{color:var(--red);font-weight:800}
.hid{display:none}
.pop{position:fixed;left:50%;top:40%;font-size:90px;z-index:5;pointer-events:none;animation:pp 1s ease-out forwards}
@keyframes pp{0%{transform:translate(-50%,0) scale(.3);opacity:0}30%{opacity:1;transform:translate(-50%,-30px) scale(1.2)}100%{transform:translate(-50%,-120px) scale(1);opacity:0}}
</style></head><body>
<div id="stk"></div>
<div class="wrap">
<section id="home" class="card hero">
  <div class="mascot">🐰</div>
  <h1>Quiz Lịch sử Đảng</h1>
  <p class="sub">Ôn tập thật vui cùng các bé sticker ✨ · Ngân hàng <b id="tot"></b> câu</p>
  <div class="lbl">🎀 Chọn số câu muốn làm</div>
  <div class="chips" id="chips"></div>
  <div class="cnt" style="margin-top:14px"><input type="range" id="rg" min="1" value="20"><input type="number" id="nm" min="1" value="20"></div>
  <div class="tog">
    <label><input type="checkbox" id="shq" checked> Trộn câu hỏi 🔀</label>
    <label><input type="checkbox" id="sho" checked> Trộn đáp án 🍬</label>
  </div>
  <button class="btn" id="go">Bắt đầu thôi! 🌸</button>

  <!-- BẮT ĐẦU PHẦN CODE MỚI THÊM -->
  <div class="lbl" style="margin-top:24px; font-size:16px;">🎯 Hoặc gõ số thứ tự để làm 1 câu cụ thể:</div>
  <div class="cnt" style="margin-top:10px">
    <input type="number" id="jumpQ" min="1" placeholder="VD: 56" style="width:120px">
    <button class="btn sm alt" id="jumpBtn" style="margin:0; padding:10px 20px;">Tới luôn 🚀</button>
  </div>
  <!-- KẾT THÚC PHẦN MỚI -->
</section>
</section>

<section id="play" class="hid">
  <div class="card">
    <div class="top"><span id="prog">1/20</span><div class="bar"><i id="pb"></i></div><span id="sc">⭐ 0</span></div>
    <div style="margin-top:14px"><span class="qn" id="qn"></span></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="row"><button class="btn sm alt" id="quit">🏠 Thoát</button><button class="btn sm" id="nx" disabled>Câu tiếp ➜</button></div>
  </div>
</section>

<section id="end" class="hid">
  <div class="card res">
    <div class="mascot" id="em">🎉</div>
    <h2 id="et" style="margin:6px 0;color:var(--pink);font-size:28px"></h2>
    <div class="score" id="es"></div>
    <p class="sub" id="ep"></p>
    <button class="btn" id="again">Làm lại 🔁</button>
    <button class="btn alt" id="wrongOnly">Làm lại các câu sai 💪</button>
    <button class="btn alt" id="home2">Về trang chọn số câu 🏠</button>
  </div>
  <div class="card" id="rvc"><div class="lbl" style="margin-top:0">📝 Xem lại các câu sai</div><div id="rv"></div></div>
</section>
</div>
<script>
const DATA=[
{"q":"Nghiên cứu, biên soạn, học tập Lịch sử Đảng có chức năng","o":["giáo dục tình thần yêu nước, ý thức, niềm tự hào, tự tôn, ý chí tự lực, tự cường dân tộc.","giáo dục tư tưởng chính trị, nâng cao nhận thức tư tưởng, lý luận, con đường phát triển của cách mạng và dân tộc Việt Nam.","giáo dục chủ nghĩa anh hùng cách mạng và giáo dục đạo đức, lối sống cao đẹp.","Bao gồm tất cả các phương án trên."],"a":3},
{"q":"Trong các đối tượng nghiên cứu sau đây của khoa học lịch sử, đối tượng nào không phải của khoa học Lịch sử Đảng Cộng sản Việt Nam?","o":["Sự kiện lịch sử Đảng.","Cương lĩnh, đường lối của Đảng.","Nghệ thuật quân sự.","Hệ thống tổ chức của Đảng."],"a":2},
{"q":"Đối tượng nghiên cứu của môn Lịch sử Đảng Cộng sản Việt Nam là","o":["các sự kiện lịch sử Đảng.","Cương lĩnh, đường lối của Đảng.","quá trình lãnh đạo, chỉ đạo, tổ chức thực tiễn của Đảng trong tiến trình cách mạng.","Bao gồm tất cả các phương án."],"a":3},
{"q":"Nhiệm vụ của khoa học Lịch sử Đảng Cộng sản Việt Nam là","o":["trình bày có hệ thống Cương lĩnh, đường lối của Đảng.","tái hiện tiến trình lịch sử lãnh đạo, đấu tranh của Đảng.","tổng kết lịch sử của Đảng và làm rõ vai trò, sức chiến đấu của hệ thống tổ chức Đảng.","Bao gồm tất cả các phương án."],"a":3},
{"q":"Phương pháp nghiên cứu cơ bản của môn học Lịch sử Đảng Cộng sản Việt Nam là gì?","o":["Lịch sử và logic.","Tổng hợp và so sánh."],"a":0},
{"q":"Điểm nào dưới đây không thuộc về bối cảnh lịch sử thế giới cuối thế kỷ XIX, đầu thế kỷ XX đã tác động đến sự ra đời của Đảng Cộng sản Việt Nam?","o":["Phong trào giải phóng dân tộc phát triển mạnh mẽ, rộng khắp.","Thắng lợi của Cách mạng Tháng Mười Nga 1917.","Quốc tế Cộng sản Quốc tế III thành lập 1919.","Cách mạng Việt Nam lâm vào tình trạng khủng hoảng sâu sắc về đường lối và giai cấp lãnh đạo."],"a":3},
{"q":"Trước khi thực dân Pháp xâm lược trước năm 1858, Việt Nam là một xã hội như thế nào?","o":["Thuộc địa.","Thuộc địa nửa phong kiến.","Phong kiến độc lập.","Tư bản chủ nghĩa."],"a":2},
{"q":"Mưu đồ kinh tế của thực dân Pháp khi xâm lược Việt Nam nói riêng và Đông Dương nói chung là gì?","o":["Biến nơi đây thành thị trường tiêu thụ hàng hoá.","Vơ vét tài nguyên.","Bóc lột sức lao động giá rẻ, cùng nhiều hình thức thuế khoá.","Bao gồm tất cả các phương án."],"a":3},
{"q":"Thực dân Pháp nổ súng xâm lược Việt Nam lần thứ nhất tại địa điểm nào?","o":["Hà Nội.","Thừa Thiên - Huế.","Đà Nẵng.","Sài Gòn."],"a":2},
{"q":"Dưới chính sách thống trị của thực dân Pháp, yêu cầu cấp bách nhất của nhân dân Việt Nam là gì?","o":["Tự do, dân chủ, cơm áo và hòa bình.","Tự do, bình đẳng, bác ái.","Độc lập dân tộc.","Ruộng đất."],"a":2},
{"q":"Trong những điểm sau đây nói về chính sách cai trị của thực dân Pháp đối với nhân dân ta, điểm nào thuộc về chính sách kinh tế?","o":["Chia Việt Nam ra thành ba kỳ: Bắc Kỳ, Trung Kỳ, Nam Kỳ.","Chính sách khai thác thuộc địa.","Thực hiện chính sách dung túng, duy trì các hủ tục lạc hậu trong nhân dân ta.","Thực hiện khẩu hiệu: tự do, bình đẳng, bác ái."],"a":1},
{"q":"Thực dân Pháp dùng chính sách “chia để trị” nhằm mục đích gì?","o":["Chia cắt đất nước ta lâu dài.","Tách mỗi miền thành một quốc gia riêng.","Phá vỡ khối đoàn kết cộng đồng quốc gia dân tộc.","Tất cả các phương án đều sai."],"a":2},
{"q":"“Nhà tù nhiều hơn trường học” là chính sách cai trị của thực dân Pháp đối với nhân dân ta trên lĩnh vực nào?","o":["Kinh tế.","Chính trị.","Văn hoá - xã hội.","Quân sự."],"a":2},
{"q":"Trong xã hội thuộc địa nửa phong kiến, giai cấp nông dân Việt Nam ngoài mâu thuẫn vốn có với giai cấp địa chủ, thì họ còn có mâu thuẫn nào khác?","o":["Mâu thuẫn với thực dân Pháp xâm lược.","Mâu thuẫn với giai cấp tư sản.","Mâu thuẫn với giai cấp công nhân.","Bao gồm tất cả các phương án."],"a":0},
{"q":"Mâu thuẫn chủ yếu nhất và ngày càng gay gắt trong xã hội Việt Nam dưới ách thống trị của thực dân Pháp là gì?","o":["Nông dân với địa chủ.","Tư sản với công nhân.","Công nhân với nông dân.","Toàn thể dân tộc Việt Nam với thực dân Pháp và phong kiến phản động."],"a":3},
{"q":"Trong những điểm sau đây nói về tác động của chính sách cai trị của thực dân Pháp đối với nhân dân Việt Nam, điểm nào nói về phân hóa giai cấp ở nước ta?","o":["Tạo ra những giai cấp, tầng lớp mới công nhân, tư sản dân tộc, tiểu tư sản.","Trở thành xã hội thuộc địa nửa phong kiến.","Nảy sinh mâu thuẫn cơ bản trong xã hội là: mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp xâm lược.","Chống đế quốc, giải phóng dân tộc là nhiệm vụ hàng đầu."],"a":0},
{"q":"Đặc điểm nổi bật của giai cấp công nhân Việt Nam là gì?","o":["Ra đời trước giai cấp tư sản dân tộc Việt Nam, vừa lớn lên đã sớm tiếp thu ánh sáng của chủ nghĩa Mác - Lênin.","Ra đời sau giai cấp tư sản, vừa lớn lên đã sớm tiếp thu ảnh hưởng của chủ nghĩa Mác - Lênin.","Ra đời trước giai cấp địa chủ phong kiến, vừa lớn lên đã sớm tiếp thu ảnh hưởng của chủ nghĩa Mác - Lênin.","Ra đời trước tầng lớp tiểu tư sản, vừa lớn lên đã sớm tiếp thu ảnh hưởng của chủ nghĩa Mác - Lênin."],"a":0},
{"q":"Dưới sự thống trị của thực dân Pháp, giai cấp, tầng lớp nào ở Việt Nam được đánh giá là: có tinh thần dân tộc, yêu nước và rất nhạy cảm về chính trị và thời cuộc?","o":["Tầng lớp tiểu tư sản.","Giai cấp tư sản.","Giai cấp địa chủ.","Giai cấp công nhân."],"a":0},
{"q":"Phong trào Cần Vương diễn ra thời gian nào?","o":["1885-1896.","1884-1913.","1884-1896.","1885-1913."],"a":0},
{"q":"Thắng lợi của cuộc cách mạng nào đã tác động sâu sắc đến phong trào giải phóng dân tộc ở các nước thuộc địa?","o":["Cách mạng Tân Hợi 1911.","Cách mạng của nhân dân dân Trung Hoa 1949.","Cách mạng Cuba 1959.","Cách mạng Tháng Mười Nga 1917."],"a":3},
{"q":"Phong trào Cần Vương thuộc khuynh hướng cứu nước nào?","o":["Dân chủ tư sản.","Phong kiến.","Vô sản.","Tất cả các phương án đều sai."],"a":1},
{"q":"Phong trào Cần Vương do ai khởi xướng và lãnh đạo?","o":["Vua Hàm Nghi và Tôn Thất Thuyết.","Hoàng Hoa Thám.","Phan Bội Châu.","Phan Chu Trinh."],"a":0},
{"q":"Phong trào khởi nghĩa Yên Thế Bắc Giang do ai lãnh đạo?","o":["Hoàng Hoa Thám.","Tôn Thất Thuyết.","Phan Đình Phùng.","Nguyễn Thái Học."],"a":0},
{"q":"Phong trào khởi nghĩa Yên Thế thuộc khuynh hướng cứu nước nào?","o":["Cải lương.","Phong kiến.","Dân chủ tư sản.","Vô sản."],"a":1},
{"q":"Phong trào yêu nước do Phan Bội Châu khởi xướng và lãnh đạo thuộc khuynh hướng cứu nước nào?","o":["Cải lương.","Phong kiến.","Dân chủ tư sản.","Vô sản."],"a":2},

]; const $=id=>document.getElementById(id);
const E=['🌸','🐱','🍓','⭐','☁️','🎀','🐻','🍭','🦄','🐥','🌈','🍰','🐼','💖','🧸','🍩'];
(function(){const h=$('stk');const pos=[[3,8],[88,6],[6,36],[90,40],[4,68],[89,72],[12,90],[80,92],[46,3],[50,94],[22,18],[74,22]];
pos.forEach((p,i)=>{const s=document.createElement('div');s.className='stk';s.textContent=E[(i*5)%E.length];s.style.left=p[0]+'%';s.style.top=p[1]+'%';s.style.animationDelay=(i*.5)+'s';s.style.fontSize=(28+(i%3)*8)+'px';h.appendChild(s)})})();
const N=DATA.length;$('tot').textContent=N;
const rg=$('rg'),nm=$('nm');rg.max=N;nm.max=N;
let n=20;
function setN(v){n=Math.max(1,Math.min(N,parseInt(v)||1));rg.value=n;nm.value=n;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===n))}
[10,20,30,50,100,N].forEach(v=>{const b=document.createElement('button');b.className='chip';b.dataset.v=v;b.textContent=v===N?'Tất cả '+N:v+' câu';b.onclick=()=>setN(v);$('chips').appendChild(b)});
rg.oninput=()=>setN(rg.value);nm.oninput=()=>setN(nm.value);setN(20);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=[],i=0,score=0,wrong=[],done=false,lastSet=[];
const show=id=>['home','play','end'].forEach(x=>$(x).classList.toggle('hid',x!==id));
function start(idxs){
  lastSet=idxs;
  Q=idxs.map(k=>{const d=DATA[k];let o=d.o.map((t,j)=>({t,c:j===d.a}));if($('sho').checked)o=shuf(o);return{id:k+1,q:d.q,o}});
  i=0;score=0;wrong=[];show('play');window.scrollTo(0,0);render();
}
function begin(){let idx=[...Array(N).keys()];if($('shq').checked)idx=shuf(idx);start(idx.slice(0,n).sort((a,b)=>$('shq').checked?0:a-b))}
function render(){
  done=false;const c=Q[i];
  $('prog').textContent=(i+1)+'/'+Q.length;$('pb').style.width=(i/Q.length*100)+'%';$('sc').textContent='⭐ '+score;
  $('qn').textContent='Câu gốc #'+c.id;$('q').textContent=c.q;$('fb').textContent='';$('nx').disabled=true;
  $('nx').textContent=i===Q.length-1?'Xem kết quả 🎉':'Câu tiếp ➜';
  const box=$('opts');box.innerHTML='';
  c.o.forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABCD'[j]+'</b><span></span>';b.lastChild.textContent=o.t;b.onclick=()=>pick(j);box.appendChild(b)});
}
function pop(e){const p=document.createElement('div');p.className='pop';p.textContent=e;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
function pick(j){
  if(done)return;done=true;const c=Q[i];const bs=[...$('opts').children];
  bs.forEach((b,k)=>{b.disabled=true;if(c.o[k].c)b.classList.add('ok')});
  if(c.o[j].c){score++;$('fb').textContent=['Giỏi quá! 🎉','Chuẩn luôn! 💖','Xuất sắc! ⭐','Đúng rồi nè! 🌸'][Math.random()*4|0];$('fb').style.color='var(--mintd)';pop(['🎉','⭐','💖','🌟'][Math.random()*4|0])}
  else{bs[j].classList.add('no');wrong.push({...c,pick:j});$('fb').textContent='Ối, chưa đúng rồi 🥺 Cố lên nha!';$('fb').style.color='var(--red)';pop('🥺')}
  $('sc').textContent='⭐ '+score;$('nx').disabled=false;
}
$('nx').onclick=()=>{if(!done)return;i++;i<Q.length?render():finish()};
function finish(){
  show('end');window.scrollTo(0,0);const p=Math.round(score/Q.length*100);
  $('es').textContent=score+'/'+Q.length;$('ep').textContent='Đạt '+p+'% số câu đúng';
  const m=p>=90?['🦄','Siêu đỉnh luôn!!']:p>=70?['🐰','Giỏi lắm bạn ơi!']:p>=50?['🐥','Khá ổn, cố thêm chút nữa!']:['🐻','Đừng buồn, ôn thêm là ổn!'];
  $('em').textContent=m[0];$('et').textContent=m[1];
  $('wrongOnly').classList.toggle('hid',!wrong.length);$('rvc').classList.toggle('hid',!wrong.length);
  const r=$('rv');r.innerHTML='';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rv';const q=document.createElement('div');q.style.fontWeight='800';q.textContent='#'+w.id+'. '+w.q;
    const a=document.createElement('div');a.className='w';a.textContent='✗ Bạn chọn: '+w.o[w.pick].t;
    const b=document.createElement('div');b.className='a';b.textContent='✓ Đáp án: '+w.o.find(o=>o.c).t;d.append(q,a,b);r.appendChild(d)});
  if(p>=70)for(let k=0;k<5;k++)setTimeout(()=>pop(['🎉','🌸','⭐','💖','🎀'][k]),k*250);
}
$('go').onclick=begin;
$('again').onclick=()=>start(lastSet);
$('wrongOnly').onclick=()=>start(wrong.map(w=>w.id-1));
$('home2').onclick=()=>{show('home');window.scrollTo(0,0)};
$('quit').onclick=()=>{if(confirm('Thoát bài làm hiện tại nha? 🥺'))show('home')};
  $('jumpBtn').onclick = () => {
  const v = parseInt($('jumpQ').value);
  if (v >= 1 && v <= N) {
    start([v - 1]);
  } else {
    alert('Câu này chưa có trong ngân hàng! Vui lòng nhập từ 1 đến ' + N + ' nhé 🥺');
  }
};
</script></body></html>
